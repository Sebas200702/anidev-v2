name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anidev-v2:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}/anidev-v2:latest', secrets.DOCKERHUB_USERNAME) }}
            ${{ secrets.DOCKERHUB_USERNAME }}/anidev-v2:${{ github.sha }}
          platforms: linux/amd64

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # Section header at any heading level: `#`+ (any number of hashes),
          # optional spaces, then the literal `[<version>](` opener — `[` and
          # `]` are regex character classes, so they (and the dots in the
          # version) must be escaped, otherwise nothing matches. The bare form
          # `## <version> (date)` covers pre-standard-version sections. Output
          # stops at the next version header (bracketed or starting with a
          # digit), never at subsections like `### Features`.
          awk -v ver="$version" '
            BEGIN {
              v = ver
              gsub(/\./, "[.]", v)
              bracketed = "^#+ *\\[" v "\\]\\("
              bare = "^#+ *" v " *\\("
              version_header = "^#+ *([0-9]|\\[)"
            }
            $0 ~ bracketed || $0 ~ bare { found = 1; next }
            $0 ~ version_header { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [ -s "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi