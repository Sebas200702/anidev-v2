name: CI

on:
  pull_request:
  push:
    branches: ["master"]

env:
  # Placeholders that satisfy src/config/env.ts validation for the build step.
  # The gate asserts code quality only; real secrets are never needed here.
  NODE_ENV: test
  DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
  REDIS_URL: redis://localhost:6379
  APP_BASE_URL: https://example.com
  BETTER_AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  LOG_LEVEL: warn

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (Biome)
        run: bun run check

      - name: Typecheck (Astro)
        run: bun run check:types

      - name: Test (Vitest)
        run: bun run test

      - name: Coverage (Vitest)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Client budget
        run: bun scripts/client-budget.mjs

      - name: Audit (high+, allowlisted)
        run: bun run audit

  e2e:
    # Blocking end-to-end gate: boots the real Bun self-host artifact against a
    # real Postgres + Dragonfly stack and asserts over HTTP + a browser. Runs in
    # parallel with `gate`; both must pass to merge.
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Names src/config/env.ts actually requires (not the stale TURSO_/UPSTASH_
      # placeholders used by the code-quality gate above). Reach the service
      # containers via 127.0.0.1 (IPv4) — `localhost` can resolve to IPv6 `::1`
      # on the runner, which the containers' IPv4-only port maps refuse.
      DATABASE_URL: postgres://anidev:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/anidev
      REDIS_URL: redis://127.0.0.1:6379
      APP_BASE_URL: http://127.0.0.1:4331
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-e2e!!
      # Standalone self-host artifact built by @astrojs/node.
      LOG_LEVEL: warn
      # Object storage for profile image uploads: an ephemeral MinIO container
      # (built from source below). S3_SECRET_ACCESS_KEY is generated per run.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: anidev-media
      S3_ACCESS_KEY_ID: anidev-ci
      S3_PUBLIC_URL: http://127.0.0.1:9000/anidev-media
      S3_FORCE_PATH_STYLE: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anidev
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: anidev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anidev -d anidev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Generate MinIO credentials
        # Per-run secret for the throwaway MinIO; exported before any step that
        # imports src/config/env.ts (the S3_* set is all-or-none).
        run: |
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          echo "S3_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser (chromium)
        run: bun run test:e2e:install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build MinIO (CE from pinned source tags)
        # Upstream no longer publishes MinIO CE images (docker/minio/Dockerfile);
        # the GHA layer cache keeps the Go build off later runs.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: docker/minio
          load: true
          tags: anidev-minio:ci
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max

      - name: Start MinIO and create the public-read bucket
        # alias + mb + anonymous policy run in ONE container: `mc` keeps the
        # alias in ~/.mc, so split runs lose it and fail with a 403.
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            anidev-minio:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            -e S3_BUCKET="$S3_BUCKET" \
            anidev-minio:ci -ec '
              mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc mb --ignore-existing "local/$S3_BUCKET"
              mc anonymous set download "local/$S3_BUCKET"
            '

      - name: Wait for Postgres
        # Service-container health can flip green during the postgres image's
        # socket-only init phase, before TCP 5432 accepts host connections — and
        # drizzle-kit swallows the underlying pg error. Poll a real TCP query and
        # surface the exact failure so migrate runs only once the DB is truly up.
        run: |
          node -e '
          const { Client } = require("pg");
          (async () => {
            for (let i = 1; i <= 30; i++) {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              try {
                await c.connect();
                await c.query("select 1");
                await c.end();
                console.log(`postgres reachable after ${i} attempt(s)`);
                process.exit(0);
              } catch (e) {
                console.log(`attempt ${i}: ${e.message}`);
                await c.end().catch(() => {});
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error("postgres never became reachable");
            process.exit(1);
          })();
          '

      - name: Apply migrations
        run: bun run db:migrate

      - name: Build (Bun self-host artifact)
        run: bun run build

      - name: Seed E2E fixtures
        run: bun run db:seed:e2e

      - name: Integration tests (real Postgres)
        # Opt-in DB tests (RUN_DB_TESTS, set by the script) — the repository layer
        # against the real Postgres + pg_trgm, skipped in the unit `gate`. Runs
        # here where the DB is already migrated + seeded, before the browser layer.
        run: bun run test:integration

      - name: Run E2E (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7