name: Deploy & Release

# Two independent concerns, one per job:
#
# - `build-and-push` runs on every push to master and only builds and pushes
#   the Docker image as `:latest` + `:<sha>`. It never depends on version
#   computation, so a release failure cannot block a deploy. It is serialized
#   (`build-master`, non-cancelling) so `:latest` only ever moves forward;
#   GitHub keeps one pending run per group, so with 3+ merges inside one build
#   the middle commit's `:<sha>` image may be skipped (master stays correct).
#
# - `release` runs after the build and is serialized (`release-master`) so two
#   quick merges never compute the same version. When the pushed commits
#   include a releasable Conventional Commit (`feat` → minor, `fix`/`perf` →
#   patch, `!`/`BREAKING CHANGE` → major) it, in this order:
#     1. creates the `vX.Y.Z` tag on the built commit with its GitHub Release,
#     2. retags the already-pushed `:<sha>` image as `:vX.Y.Z` (so a version
#        image never exists without its git tag),
#     3. commits the new CHANGELOG.md section and package.json `version` back
#        to master as `chore(release): vX.Y.Z [skip ci]`, pushed with the
#        `RELEASE_DEPLOY_KEY` deploy key (the master ruleset's only bypass
#        actor: deploy keys).
#
# Every step is idempotent: when the tag already points at this commit it is
# reused, so "Re-run failed jobs" finishes a half-done release.
#
# Tags created with GITHUB_TOKEN do not trigger workflows, so release.yml is
# not triggered — it stays as the path for a tag pushed manually. The
# write-back commit carries `[skip ci]` (a deploy-key push would otherwise
# trigger this workflow) and `chore` never bumps, so it cannot loop.

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: build-master
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anidev-v2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anidev-v2:${{ github.sha }}
          platforms: linux/amd64

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: release-master
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history and tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Tags are needed to resume a release. No credentials persist: the
          # repository is public (fetch works anonymously) and the deploy key
          # is loaded only in the final push step, out of reach of the
          # third-party action below.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version from Conventional Commits
        id: version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No feat/fix/perf/breaking commit since the last tag → no release.
          default_bump: false
          release_branches: ^master$
          tag_prefix: v
          # Only compute; the tag is created with the GitHub Release below.
          dry_run: true

      - name: Resolve release tag
        id: resolve
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          tag="$NEW_TAG"
          if [ -z "$tag" ]; then
            # Re-run of a half-done release: the tag already points here.
            tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -n 1)"
          fi
          if [ -z "$tag" ]; then
            echo "No releasable commit since the last tag — nothing to release"
          else
            echo "Releasing $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          set -euo pipefail
          # Local refs from the full-history checkout: empty when the tag does
          # not exist yet (the normal case for a new version).
          tag_sha="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points at $tag_sha, not at the built commit $GITHUB_SHA"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on $GITHUB_SHA — skipping"
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$CHANGELOG" > "$notes_file"

          # --target creates the tag on the built commit.
          if grep -q '[^[:space:]]' "$notes_file"; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --generate-notes
          fi

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.tag != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        if: steps.resolve.outputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the built image with the version
        if: steps.resolve.outputs.tag != ''
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/anidev-v2
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Points :vX.Y.Z at the :<sha> manifest pushed by build-and-push;
          # no rebuild, safe to repeat.
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"

      - name: Sync with the latest master
        if: steps.resolve.outputs.tag != ''
        run: |
          set -euo pipefail
          # Edit on top of the current master (not the built commit) so a
          # newer write-back already on master never conflicts with this one.
          git fetch origin master
          git switch -C release-write-back origin/master

      - name: Update CHANGELOG.md and package.json
        id: write-back
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          version_re="${version//./\\.}"

          if grep -Eq "^#+ *\\[${version_re}\\]\\(" CHANGELOG.md; then
            echo "CHANGELOG.md already has a $version section"
          else
            raw="$RUNNER_TEMP/changelog-raw.md"
            section="$RUNNER_TEMP/changelog-section.md"
            if grep -q '[^[:space:]]' <<< "$CHANGELOG"; then
              printf '%s\n' "$CHANGELOG" > "$raw"
            else
              # Re-run: the action has no notes now, reuse the Release body.
              gh release view "$TAG" --json body --jq .body > "$raw"
            fi

            # Normalize to one `## [X.Y.Z](url) (date)` heading (the format
            # release.yml parses) and drop leading/trailing blank lines.
            awk -v ver="$version" -v date="$(date -u +%F)" \
              -v url="https://github.com/$GH_REPO/releases/tag/$TAG" '
              BEGIN {
                v = ver
                gsub(/\./, "[.]", v)
                heading = "^#+ *\\[" v "\\]\\("
              }
              !started && /^[[:space:]]*$/ { next }
              !started {
                started = 1
                if ($0 ~ heading) { sub(/^#+ */, "## "); out[++n] = $0; next }
                out[++n] = "## [" ver "](" url ") (" date ")"
                out[++n] = ""
              }
              { out[++n] = $0 }
              END {
                if (!started) print "## [" ver "](" url ") (" date ")"
                while (n > 0 && out[n] ~ /^[[:space:]]*$/) n--
                for (i = 1; i <= n; i++) print out[i]
              }
            ' "$raw" > "$section"

            # Insert after the header block, before the first version section.
            updated="$RUNNER_TEMP/CHANGELOG.md"
            awk -v section="$section" '
              function emit(  line) {
                while ((getline line < section) > 0) print line
                inserted = 1
              }
              !inserted && /^#+ *(\[|[0-9])/ { emit(); print ""; print "" }
              { print }
              END { if (!inserted) { print ""; emit() } }
            ' CHANGELOG.md > "$updated"
            cat "$updated" > CHANGELOG.md
          fi

          # Only move package.json forward (a re-run of an older release must
          # never downgrade it); only the version line is rewritten.
          current="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)"
          if [ "$current" != "$version" ] && [ "$newest" = "$version" ]; then
            VERSION="$version" node -e '
              const fs = require("fs")
              const source = fs.readFileSync("package.json", "utf8")
              const pattern = /^(  "version": ")[^"]*(")/m
              if (!pattern.test(source)) process.exit(1)
              const updated = source.replace(
                pattern,
                (_, open, close) => open + process.env.VERSION + close
              )
              fs.writeFileSync("package.json", updated)
            '
          fi

          if git diff --quiet -- CHANGELOG.md package.json; then
            echo "CHANGELOG.md and package.json already at $version"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the release to master
        if: steps.write-back.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          # Bypass actor of the master ruleset; exposed to this step only.
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          # GitHub's SSH host keys from its HTTPS meta API (no TOFU keyscan).
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts -o StrictHostKeyChecking=yes"
          remote="git@github.com:$GITHUB_REPOSITORY.git"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json
          # A deploy-key push triggers workflows; [skip ci] avoids a rebuild.
          git commit -m "chore(release): $TAG [skip ci]"

          for attempt in 1 2 3; do
            if git push "$remote" HEAD:master; then
              exit 0
            fi
            echo "Push attempt $attempt failed"
            if [ "$attempt" -lt 3 ] && ! git pull --rebase origin master; then
              git rebase --abort || true
              echo "::error::Rebasing chore(release): $TAG onto master conflicted"
              exit 1
            fi
          done
          echo "::error::Could not push chore(release): $TAG to master"
          exit 1
