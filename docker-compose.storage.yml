# Object storage stack for AniDev v2 (S3-compatible), split out of
# `docker-compose.yml` so it can be deployed on its own.
#
# WHY THIS FILE EXISTS SEPARATELY:
# In development it is reached through the main compose file, which `include`s
# this one — so `docker compose --profile storage up -d --build` still works and
# the default `docker compose up -d` still starts only the infra services.
# In production the app's database, cache and error tracker already run as
# independent services outside this project, so bringing up the *main* compose
# there would collide with them on ports 5432/6379/8080. Deploying this file
# instead starts only MinIO and its one-shot bucket bootstrap.
#
# USE:
#   Dev (from the repo root):  docker compose --profile storage up -d --build
#   This file alone:           docker compose -f docker-compose.storage.yml \
#                                 --profile storage up -d --build
#   Both services stay behind `profiles: ['storage']`, so a plain `up -d` on
#   either file starts nothing from this stack.
#
# REQUIRED environment: MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, S3_BUCKET.
#
# S3-compatible object storage. Built from the MinIO CE source because
# upstream stopped publishing images (see docker/minio/Dockerfile).

services:
  minio:
    build:
      context: ./docker/minio
    profiles: ['storage']
    restart: unless-stopped
    ports:
      # Loopback only: the reverse proxy (prod) and the host app (dev) reach it
      # locally; the console holds root credentials.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      # busybox wget ships with the alpine base image; the health endpoint
      # answers before the console is up.
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot bucket bootstrap. `mc` stores its alias in ~/.mc, so the alias
  # set, the bucket creation and the anonymous-read policy have to run in a
  # single container invocation — splitting them loses the alias and fails
  # with a misleading 403.
  minio-init:
    build:
      context: ./docker/minio
    profiles: ['storage']
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - S3_BUCKET=${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set download local/$${S3_BUCKET};
      echo \"bucket $${S3_BUCKET} ready\"
      "

volumes:
  minio_data:
