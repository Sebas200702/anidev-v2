# Local isolated infrastructure stack for AniDev v2 (dev only).
#
# Provisioned services matching the self-hosted target stack:
#   - PostgreSQL (app database)
#   - Dragonfly (Redis-compatible cache)
#   - Rustrak server (Sentry-compatible error tracking)
#
# Spin up with: docker compose up -d
# Tear down (keeps named volumes): docker compose down
# Wipe data too:                   docker compose down -v
#
# Local connection URLs mirror `.env.local.example`; they are separate from
# production credentials in `.env.example`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anidev
      POSTGRES_PASSWORD: anidev
      POSTGRES_DB: anidev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anidev -d anidev']
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.25.4
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rustrak:
    image: rustrak/rustrak-server:v0.14.1
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - rustrak_data:/data
    environment:
      - PORT=8080
      - SESSION_SECRET_KEY=${RUSTRAK_SESSION_SECRET_KEY:-replace-with-a-long-random-session-secret}
      - CREATE_SUPERUSER=${RUSTRAK_SUPERUSER:-admin@example.com:admin}
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO - "http://localhost:8080/health" || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  dragonfly_data:
  rustrak_data: