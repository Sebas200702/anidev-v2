# Local isolated infrastructure stack for AniDev v2.
#
# Provisioned services:
#   - postgres (app database)
#   - dragonfly (Redis-compatible cache)
#   - rustrak (Sentry-compatible error tracking)
#   - app (optional, profile "preview": the built Astro/Bun server in Docker)
#
# USE:
#   Dev (default):      docker compose up -d        -> only infra services.
#                       Then run the app on the host: bun run dev (uses localhost URLs).
#   Preview (Docker):   docker compose --profile preview up -d --build app
#                       serves the app at http://localhost:4321 from a container.
#
# Tear down (keeps named volumes): docker compose down
# Wipe data too:                   docker compose down -v
#
# Local connection URLs mirror `.env.local.example`; they are separate from
# production credentials in `.env.example`. Inside the compose network the app
# reaches services by service name (postgres, dragonfly), while host dev uses
# the published localhost ports.

services:
  app:
    build:
      context: .
      args:
        - ASTRO_ADAPTER=bun
    profiles: ['preview']
    restart: unless-stopped
    ports:
      - '4321:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://anidev:anidev@postgres:5432/anidev
      - REDIS_URL=redis://dragonfly:6379
      - APP_BASE_URL=http://localhost:4321
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local-dev-only-replace-with-at-least-32-chars}
      - SENTRY_DSN=
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anidev
      POSTGRES_PASSWORD: anidev
      POSTGRES_DB: anidev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anidev -d anidev']
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.25.4
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rustrak:
    image: rustrak/rustrak-server:v0.14.1
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - rustrak_data:/data
    environment:
      - PORT=8080
      - SESSION_SECRET_KEY=${RUSTRAK_SESSION_SECRET_KEY:-667e0e851a0df3f47d1929a54638dc9bad8563606789bd10c4a7c091070db092}
      - CREATE_SUPERUSER=${RUSTRAK_SUPERUSER:-admin@example.com:admin}

volumes:
  postgres_data:
  dragonfly_data:
  rustrak_data: